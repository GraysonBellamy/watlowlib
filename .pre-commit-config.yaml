default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        # src/watlowlib/data/pm_parameters.json is the EZ-ZONE register list
        # extracted from Watlow's official spreadsheet (~1.1 MB); it ships
        # with the wheel and is the source of truth for the parameter
        # registry. Threshold sized to fit it with headroom.
        args: ["--maxkb=1500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        # watlow-specific terms: watlow, stdbus, modbus, bacnet, mstp, ezzone,
        # ain (analog input), pid, plc, rtu, ize (Watlow EZ-ZONE menu names).
        # ``src/watlowlib/data/*.json`` are vendored from Watlow's official
        # register-list spreadsheet — they carry upstream documentation typos
        # *and* 3–4 char EZ-ZONE display strings (``TRU``, ``tE``, ``PrES``,
        # …) that must round-trip what the device returns; fixing them locally
        # would diverge from the manufacturer's spec.
        args:
          - "--ignore-words-list=watlow,stdbus,bacnet,mstp,ezzone,ain,ize,doub,inout,unparseable"
          - "--skip=src/watlowlib/data/*.json,uv.lock"

  # Local hooks — run type checkers via `uv run` against the same dep
  # groups CI uses, so the local typecheck env is identical to the CI
  # typecheck env. `--frozen` makes the hook fail loudly if uv.lock no longer
  # satisfies the requested groups.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (matches CI typecheck env)
        entry: uv run --frozen --group type --group test mypy
        language: system
        pass_filenames: false
        files: ^(src|tests)/

      - id: pyright
        name: pyright (matches CI typecheck env)
        entry: uv run --frozen --group type --group test pyright
        language: system
        pass_filenames: false
        files: ^(src|tests)/

ci:
  autoupdate_schedule: monthly
  skip: [mypy, pyright]
