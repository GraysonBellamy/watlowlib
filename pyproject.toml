[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "watlowlib"
dynamic = ["version"]
description = "Python library for Watlow temperature controllers (Standard Bus and Modbus RTU over serial)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Grayson Bellamy", email = "gbellamy@umd.edu" }]
keywords = [
    "watlow",
    "ezzone",
    "pm",
    "f4t",
    "temperature",
    "controller",
    "process-control",
    "standard-bus",
    "modbus",
    "modbus-rtu",
    "bacnet-mstp",
    "rs485",
    "serial",
    "instrument",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AnyIO",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.13",
    "anyserial>=0.1,<0.2",
    "anymodbus>=0.1.1,<0.2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
parquet = ["pyarrow>=16"]
trio = ["trio>=0.27"]
docs = [
    "zensical>=0.0.33",
    "mkdocstrings-python>=1.12",
]

[project.scripts]
watlow-read = "watlowlib.cli.read:main"
watlow-discover = "watlowlib.cli.discover:main"
watlow-decode = "watlowlib.cli.decode:main"
watlow-raw = "watlowlib.cli.raw:main"
watlow-configure = "watlowlib.cli.configure:main"
watlow-diag = "watlowlib.cli.diagnostics:main"

[project.urls]
Homepage = "https://github.com/GraysonBellamy/watlowlib"
Repository = "https://github.com/GraysonBellamy/watlowlib"
Documentation = "https://GraysonBellamy.github.io/watlowlib/"
Issues = "https://github.com/GraysonBellamy/watlowlib/issues"
Changelog = "https://github.com/GraysonBellamy/watlowlib/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Hatch build
# ---------------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.build.hooks.vcs]
version-file = "src/watlowlib/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/watlowlib"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

# ---------------------------------------------------------------------------
# uv — dependency groups (PEP 735)
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "test" },
    { include-group = "docs" },
    "pre-commit>=4.0",
]
lint = [
    "ruff>=0.15.11",
]
type = [
    "mypy>=1.20",
    "pyright>=1.1.390",
]
test = [
    "pytest>=8.3",
    # AnyIO ships its own pytest plugin; pytest-asyncio would conflict with it
    # (the two auto-modes disagree, and pytest-asyncio wraps fixtures in fresh
    # tasks that break cancel scopes / task groups). See AnyIO testing docs.
    "pytest-cov>=6.0",
    "coverage[toml]>=7.13.5",
    "hypothesis>=6.112",
    "trio>=0.27",       # used as a secondary AnyIO backend in cross-backend tests
    "uvloop>=0.22.1; platform_system == 'Linux' or platform_system == 'Darwin'",
]
docs = [
    "zensical>=0.0.33",
    "mkdocstrings-python>=1.12",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Generated by hatch-vcs.
extend-exclude = [
    "src/watlowlib/_version.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async (general async lints; wait_for ban is enforced via TID251 below)
    "PL",   # pylint
    "PT",   # pytest-style
    "RUF",  # ruff-specific
    "D",    # pydocstyle (Google)
    "N",    # pep8-naming
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print (no print in library)
    "TID",  # flake8-tidy-imports
    "TC",   # flake8-type-checking (was TCH)
    "PTH",  # flake8-use-pathlib
    "ANN",  # flake8-annotations
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "A",    # flake8-builtins
]
ignore = [
    "D100",    # missing module docstring — tolerated for now on stubs
    "D104",    # missing docstring in public package
    "D105",    # magic method docstrings — __str__ / __repr__ rarely need docs
    "D107",    # __init__ docstrings — class docstring covers it
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "PLR0913", # too many args — common for device methods
    "RUF002",  # ambiguous unicode in docstrings — en/em dashes are fine
    "RUF003",  # ambiguous unicode in comments
    "ANN401",  # Any in annotations — sometimes legitimate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101", "PLR2004", "PLC0415", "S", "ASYNC109"]
"examples/**" = ["D", "T20", "S101", "PLR2004", "INP001"]
# CLIs are user-facing entry points: stdout *is* the API, so ``print``
# is appropriate; argparse builders / ``main`` don't need their own
# docstrings on top of the module docstring. ASYNC230 / ASYNC240 are
# off because CLIs use blocking ``Path.write_text`` / ``Path.open`` to
# emit output — the event loop is closing as the CLI returns, so the
# anyio.path overhead would be ceremony with no benefit.
"src/watlowlib/cli/**" = ["T20", "D103", "ASYNC230", "ASYNC240"]
# Transport, protocol client, session, factory, discovery, and manager expose
# a per-call ``timeout`` at every I/O boundary (design §8.1, §6.1). ASYNC109
# discourages that in favor of ``anyio.fail_after`` *around* the call, but the
# design goal is to surface per-call bounds through the Protocol so
# implementations can't elide them.
"src/watlowlib/transport/**" = ["ASYNC109", "D102"]
"src/watlowlib/protocol/**" = ["ASYNC109"]
"src/watlowlib/devices/factory.py" = ["ASYNC109"]
"src/watlowlib/devices/discovery.py" = ["ASYNC109"]
"src/watlowlib/devices/controller.py" = ["ASYNC109"]
"src/watlowlib/devices/loop.py" = ["ASYNC109"]
"src/watlowlib/manager.py" = ["ASYNC109"]
"src/watlowlib/maintenance.py" = ["ASYNC109"]
# Diagnostics / configure CLIs surface ``timeout=`` per-call (matching
# the rest of the I/O-boundary surface in the library). PLR2004 is off
# on the diagnostics CLIs because the parameter-id constants
# (17001..17051, etc.) are wire-spec values that would lose context if
# rebound to local names.
"src/watlowlib/cli/diagnostics/**" = ["T20", "D103", "ASYNC109", "ASYNC230", "ASYNC240", "PLR2004"]
"src/watlowlib/cli/configure.py" = ["T20", "D103", "ASYNC109"]
# Codec layer faithfully encodes the BACnet MS/TP and Watlow attribute-service
# wire format. Length sentinels (``< 5``, ``< 7``), value-range bounds
# (``<= 0xFF`` / ``<= 0xFFFF``), and SBN/MAC ranges (``1..16`` / ``0x10..0x1F``)
# are the protocol; rebinding them to named constants would obscure the wire
# spec without making it safer. The decode dispatch over the closed set of
# type tags also exceeds the default branch / return budget by design.
"src/watlowlib/protocol/stdbus/framing.py" = ["ASYNC109", "PLR2004"]
"src/watlowlib/protocol/stdbus/payload.py" = ["ASYNC109", "PLR0911", "PLR0912", "PLR2004"]
"src/watlowlib/protocol/stdbus/tables.py" = ["PLR2004"]
"src/watlowlib/protocol/stdbus/tlv.py" = ["PLR0911", "PLR0912", "PLR2004"]
# Modbus subpackage: register-block constants (1 reg / 2 regs / 0xFFFF /
# 1..247 slave range / 125-register PDU max) are wire-spec values, not
# unnamed magic. The codec dispatches over the closed ``DataType`` set
# (FLOAT / S32 / U32 / U16 / U8 / PACKED / STRING) so PLR0911 / PLR0912
# fall out the same way they do on the stdbus side. The exception
# remap walks the closed ``ModbusError`` hierarchy.
"src/watlowlib/protocol/modbus/client.py" = ["ASYNC109", "PLR2004"]
"src/watlowlib/protocol/modbus/codec.py" = ["PLR0911", "PLR0912", "PLR2004"]
"src/watlowlib/protocol/modbus/errors.py" = ["PLR0911"]
"src/watlowlib/protocol/modbus/ops.py" = ["PLR2004"]
"src/watlowlib/protocol/modbus/transport.py" = ["ASYNC109", "D102"]
# ``Session.execute`` dispatches across both protocols + handles the
# availability state machine; the branch count is intrinsic.
"src/watlowlib/devices/session.py" = ["ASYNC109", "PLR0912", "PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# asyncio.wait_for has cancel-leak corner cases and is superseded by
# asyncio.timeout() / anyio.fail_after.
"asyncio.wait_for".msg = "Use anyio.fail_after / anyio.move_on_after instead."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

# ---------------------------------------------------------------------------
# mypy — strict
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
show_error_codes = true
show_column_numbers = true
pretty = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "unused-awaitable",
    "possibly-undefined",
]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
files = ["src", "tests"]
exclude = ["src/watlowlib/_version\\.py"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# pyarrow is an optional extra and ships no py.typed marker as of 16.x.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
follow_imports = "skip"

# asyncpg is an optional extra.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Pyright — secondary type checker
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/watlowlib/_version.py", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"

# Tests rely on pytest helpers (pytest.approx, dataclass field
# defaults, etc.) that ship without full element-type information.
# Suppress those Unknown-* checks under tests/ — `mypy --strict` and
# the per-file-ignores in [tool.ruff.lint.per-file-ignores] keep test
# code honest where it counts.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# No asyncio_mode: we use AnyIO's pytest plugin instead of pytest-asyncio.
# Async tests mark with @pytest.mark.anyio; cross-backend coverage comes from
# the parametrised anyio_backend fixture in tests/conftest.py.
xfail_strict = true
markers = [
    "hardware: requires a connected Watlow controller (read-only)",
    "hardware_stateful: changes device state (setpoint writes, parameter writes) — opt in via WATLOWLIB_ENABLE_STATEFUL_TESTS=1",
    "hardware_destructive: destructive ops (calibration, baud / address / protocol-mode change) — opt in via WATLOWLIB_ENABLE_DESTRUCTIVE_TESTS=1",
    "slow: excluded from the fast CI run",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not hardware and not hardware_stateful and not hardware_destructive",
]
filterwarnings = [
    "error",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source_pkgs = ["watlowlib"]
branch = true
parallel = true
omit = [
    "src/watlowlib/_version.py",
]

[tool.coverage.paths]
watlowlib = ["src/watlowlib", "*/site-packages/watlowlib"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
    "\\.\\.\\.",
]
